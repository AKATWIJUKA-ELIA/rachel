<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test</title>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f5f5f5; color: #1e293b; }
.header { display: flex; align-items: center; gap: 20px; padding-bottom: 15px; border-bottom: 3px solid #3b82f6; margin-bottom: 25px; }
.header img { max-width: 100px; max-height: 100px; border-radius: 8px; }
.header h1 { margin: 0 0 8px 0; color: #1e3a5f; }
.header p { margin: 0; color: #64748b; }
.pages-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
.page-card { display: block; padding: 20px; background: white; border: 1px solid #e5e7eb; border-radius: 8px; text-decoration: none; color: #1e40af; font-weight: 500; transition: all 0.2s; }
.page-card:hover { background: #eff6ff; border-color: #3b82f6; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15); }
.page-card .num { display: inline-block; background: #3b82f6; color: white; width: 28px; height: 28px; border-radius: 50%; text-align: center; line-height: 28px; margin-right: 10px; font-size: 0.85em; }
</style>
</head>
<body>

<div class="header">
<img src="logo.jpeg" alt="">
<div>
<h1>Test</h1>
<p>testing building</p>
</div>
</div>

<div class="pages-grid">
<a href="page1.html" class="page-card"><span class="num">1</span>test</a>
</div>

</body>
</html>
